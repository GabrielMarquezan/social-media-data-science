name: Build Windows executable

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m spacy download pt_core_news_sm

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller coleta-dados.spec --noconfirm --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColetaDeDados-windows
          path: dist/ColetaDeDados

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          Compress-Archive -Path dist\ColetaDeDados\* -DestinationPath ColetaDeDados-windows.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ColetaDeDados-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
