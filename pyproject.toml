[project]
name = "coleta-de-dados"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apify-client>=3.0.2",
    "bertopic>=0.16.0",
    "keybert>=0.8.0",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.6.0",
    "sentence-transformers>=3.0.0",
    "spacy>=3.7.0",
    "torch>=2.12.0",
    "transformers>=5.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["social_media/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
